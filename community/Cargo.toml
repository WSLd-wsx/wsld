[package]
name = "wsx-community-slice"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
publish = false

[workspace]

[dependencies]
wsx-host = { path = "../host" }
wsx-gui-contract = { path = "../gui" }
wsx-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "custom-protocol"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
